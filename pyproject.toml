[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipti"
version = "2.0.0"
description = "Evidence-based IP threat intelligence and risk assessment for whitelisting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "bayufedra" }]
keywords = ["security", "threat-intelligence", "ip", "abuseipdb", "virustotal", "otx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ipti = "ipti.cli:main"

[project.urls]
Homepage = "https://github.com/bayufedra/ipti"
Repository = "https://github.com/bayufedra/ipti"

[tool.setuptools.packages.find]
include = ["ipti*"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # function calls in argument defaults (argparse patterns)
    "SIM108", # ternary vs if/else — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:ipti.compat",
]

[tool.coverage.run]
source = ["ipti"]
omit = ["ipti/cli.py"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
files = ["ipti"]
